packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests'

# pnpm blocks dependency build scripts by default. Each allowance is explicit instead of
# approved interactively: esbuild's postinstall fetches the platform binary that Vitest needs.
# better-sqlite3 needs none: its package carries the prebuilt SQLite driver for every platform.
allowBuilds:
  better-sqlite3: set this to true or false
  esbuild: true
  simple-git-hooks: true
