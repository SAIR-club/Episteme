# The merge gate AGENTS.md assumes: main must stay releasable, and green CI is what proves it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json `engines`; 24 is the current LTS.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7

      # Standalone pnpm carries its own runtime, so the version pinned in `packageManager` runs regardless
      # of which Node the matrix is testing the project against.
      - uses: pnpm/action-setup@v4
        with:
          standalone: true

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `check` is typecheck + lint + build + test. Formatting is not part of it, so it is checked here.
      - run: pnpm check

      - run: pnpm format:check
